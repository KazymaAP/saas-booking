# pnpm-workspace.yaml — настройки установки зависимостей (pnpm 12).
#
# minimumReleaseAge: не ставить пакет, опубликованный меньше суток назад. Это защита от подмены
# пакета в первые часы после публикации (самый частый вектор supply-chain-атак). Без базового значения
# список minimumReleaseAgeExclude ниже не действует, поэтому оба ключа идут вместе.
minimumReleaseAge: 1440

# Исключения из правила: версии, которые нужно было поставить сразу (свежие security-релизы почтового стека).
minimumReleaseAgeExclude:
  - '@zone-eu/mailsplit@5.4.31'
  - libmime@5.6.5
  - libqp@3.0.2
  - mailparser@3.14.5
  - nodemailer@10.6.0
  - imapflow@2.12.1

# install-скрипты пакетов не запускаются (esbuild собирается из готового бинарника).
allowBuilds:
  esbuild: false
